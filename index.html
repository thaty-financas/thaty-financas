<section id="home" class="page">

  <h2 id="homeGreeting">
    Olá, Thaty! 👋
  </h2>

  <button
    id="privacyToggle"
    class="valuePrivacyButton"
    type="button"
    aria-label="Ocultar valores"
    aria-pressed="false"
    title="Ocultar valores"
  >
    👁️
  </button>

  <div class="card" style="max-width:520px;margin-top:18px;">

    <div class="muted">
      Saldo Atual
    </div>

    <div
      id="dashboardBalance"
      class="value"
      style="font-size:40px;margin-top:15px;"
    >
      R$ 0,00
    </div>

    <div class="muted" style="margin-top:10px;">
      Seu saldo disponível hoje.
    </div>

  </div>

</section>
<h2>Contas</h2>
<div class="card">

  <h3>Resumo das Contas</h3>

  <div class="debtCards">

    <div class="debtStat total">
      <div class="debtStatLabel">Dívidas Totais</div>
      <div id="billsTotalDebt" class="debtStatValue">R$ 0,00</div>
    </div>

    <div class="debtStat open">
      <div class="debtStatLabel">Em aberto</div>
      <div id="billsMonthTotal" class="debtStatValue">R$ 0,00</div>
    </div>

    <div class="debtStat paid">
      <div class="debtStatLabel">Pagas</div>
      <div id="billsPaidCount" class="debtStatValue">0</div>
    </div>

    <div class="debtStat count">
      <div class="debtStatLabel">Pendentes</div>
      <div id="billsPendingCount" class="debtStatValue">0</div>
    </div>

  </div>

</div>
